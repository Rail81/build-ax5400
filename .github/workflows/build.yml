name: Build OpenWrt for AX5400

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gstreamer1.0-plugins-base \
        gettext libssl-dev libncurses5-dev libncursesw5-dev zlib1g-dev python3 \
        python3-pip python3-ply python3-pyelftools git rsync unzip libglib2.0-dev libltdl-dev wget file time

    - name: Clone source code
      run: |
        # Используем стабильную ветку
        git clone -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt openwrt
        cd openwrt
        
        # Подключаем репозиторий Подкопа
        echo "src-git podkop https://github.com/podkop-routing/openwrt-podkop.git" >> feeds.conf.default
        
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate configuration
      run: |
        cd openwrt
        cat << 'EOF' > .config
        CONFIG_TARGET_qualcommax=y
        CONFIG_TARGET_qualcommax_ipq50xx=y
        CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_xiaomi_redmi-ax5400=y

        # Модули ядра для Podkop / sing-box
        CONFIG_PACKAGE_sing-box=y
        CONFIG_PACKAGE_kmod-nft-tproxy=y
        CONFIG_PACKAGE_kmod-inet-diag=y
        CONFIG_PACKAGE_kmod-tun=y
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_bind-dig=y
        CONFIG_PACKAGE_coreutils-base64=y

        # Сам Podkop и русификация
        CONFIG_PACKAGE_podkop=y
        CONFIG_PACKAGE_luci-app-podkop=y
        CONFIG_PACKAGE_luci-i18n-podkop-ru=y
        EOF
        make defconfig

    - name: Download packages
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      run: |
        cd openwrt
        # Запуск сборки в 2 потока для стабильности
        make -j2 IGNORE_ERRORS=1 || make -j1 V=s IGNORE_ERRORS=1

    - name: Prepare Artifacts
      run: |
        mkdir -p /tmp/out
        cp openwrt/bin/targets/qualcommax/ipq50xx/*sysupgrade.bin /tmp/out/ 2>/dev/null || true

    - name: Upload firmware to release
      uses: actions/upload-artifact@v4
      with:
        name: Redmi_AX5400_Podkop_Firmware
        path: /tmp/out/*sysupgrade.bin
